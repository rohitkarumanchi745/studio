# Full Studio stack, locally, in one command:  docker compose -f deploy/local/docker-compose.yml up --build
# Then open http://localhost:8000  (admin@studio.local / admin123)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    volumes: [studio_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../..            # repo root — uses the same Dockerfile Railway builds
      dockerfile: Dockerfile
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://studio:studio@db:5432/studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_SECRET: local-dev-secret-change-me     # required; any stable string locally
      STUDIO_ADMIN_EMAIL: admin@studio.local
      STUDIO_ADMIN_PASSWORD: admin123
      STUDIO_DEMO_MODE: "1"                          # seeds demo warehouse + demo logins
      PORT: "8000"
      # Optional — leave unset to run without them (features degrade gracefully):
      # ANTHROPIC_API_KEY / OPENAI_API_KEY   (agent uses fallback if absent)
      # STUDIO_LLM_BASE_URL / HARRIER_EMBED_URL  (BitNet routing / KAG embeddings)
      # AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET  (M365 extraction)
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  studio_pg:
