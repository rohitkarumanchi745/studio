# EXAMPLE ONLY. This file is intentionally excluded from kustomization.yaml.
# Copy it outside Git, replace every CHANGE_ME value, and apply that private
# file (or create identically named Secrets with External Secrets/Sealed
# Secrets/a cloud secret CSI driver). Never apply this example unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: studio-app-secrets
  namespace: studio-system
type: Opaque
stringData:
  DATABASE_URL: postgresql://studio:CHANGE_ME@studio-db.example:5432/studio?sslmode=require
  REDIS_URL: rediss://:CHANGE_ME@studio-redis.example:6379/0
  POSTGRES_DSN: postgresql://warehouse_reader:CHANGE_ME@warehouse.example:5432/warehouse?sslmode=require
  STUDIO_SECRET: CHANGE_ME_AT_LEAST_48_RANDOM_CHARACTERS
  STUDIO_ADMIN_EMAIL: operator@example.invalid
  STUDIO_ADMIN_PASSWORD: CHANGE_ME_LONG_UNIQUE_PASSWORD
  # Configure at least the provider selected by STUDIO_LLM.
  ANTHROPIC_API_KEY: CHANGE_ME_OR_REMOVE
  OPENAI_API_KEY: CHANGE_ME_OR_REMOVE
  # Production should configure SMTP; otherwise messages use an ephemeral pod outbox.
  SMTP_HOST: smtp.example.invalid
  SMTP_PORT: "587"
  SMTP_USER: CHANGE_ME
  SMTP_PASSWORD: CHANGE_ME
  SMTP_FROM: studio@example.invalid
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-lightning-auth
  namespace: studio-system
type: Opaque
stringData:
  token: CHANGE_ME_LONG_RANDOM_BEARER_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: recovery-model-secrets
  namespace: studio-system
type: Opaque
stringData:
  # Default recovery-model-config selects Anthropic. Other LangChain providers
  # may use their provider-specific environment keys in this same Secret.
  ANTHROPIC_API_KEY: CHANGE_ME
  OPENAI_API_KEY: CHANGE_ME_OR_REMOVE
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-api-user
  namespace: studio-system
type: Opaque
stringData:
  username: studio
  password: CHANGE_ME_LONG_UNIQUE_PASSWORD
  email: airflow-operator@example.invalid
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-metadata
  namespace: studio-system
type: Opaque
stringData:
  # The official chart requires this exact key.
  connection: postgresql://airflow:CHANGE_ME@airflow-db.example:5432/airflow?sslmode=require
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-fernet-key
  namespace: studio-system
type: Opaque
stringData:
  # Generate with: python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
  fernet-key: CHANGE_ME_VALID_FERNET_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-api-secret
  namespace: studio-system
type: Opaque
stringData:
  api-secret-key: CHANGE_ME_AT_LEAST_32_RANDOM_CHARACTERS
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-jwt-secret
  namespace: studio-system
type: Opaque
stringData:
  jwt-secret: CHANGE_ME_AT_LEAST_32_DIFFERENT_RANDOM_CHARACTERS
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-connections
  namespace: studio-system
type: Opaque
stringData:
  # Deliberately distinct from studio-app-secrets/POSTGRES_DSN. Studio's
  # planner gets a SELECT-only identity; approved Airflow tasks get a narrowly
  # scoped writer that can SELECT inputs and CREATE/INSERT only in the pipeline
  # output schema.
  AIRFLOW_CONN_STUDIO_POSTGRES: postgresql://warehouse_pipeline_writer:CHANGE_ME_DIFFERENT_PASSWORD@warehouse.example:5432/warehouse?sslmode=require&options=-csearch_path%3Dpublic%2Cpipeline_output%20-cstatement_timeout%3D900000%20-clock_timeout%3D30000
---
# Used only by overlays/bitnet. Both consumers reference this one key, avoiding
# an auth mismatch between the private bridge and BitNet gateway.
apiVersion: v1
kind: Secret
metadata:
  name: bitnet-auth
  namespace: studio-system
type: Opaque
stringData:
  token: CHANGE_ME_LONG_RANDOM_BITNET_GATEWAY_TOKEN
  # Optional; used for gated Hugging Face base/adapter downloads.
  hugging_face_token: CHANGE_ME_OR_REMOVE
