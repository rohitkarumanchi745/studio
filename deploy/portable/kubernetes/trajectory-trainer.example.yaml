# EXAMPLE, intentionally excluded from base/kustomization.yaml.
# Build a CUDA-capable image from scripts/Dockerfile.trainer (replacing its
# CPU torch wheel), set the empty values below, then unsuspend the one-shot Job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studio-trajectory-training
  namespace: studio-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-trajectory-trainer-config
  namespace: studio-system
data:
  STUDIO_API_URL: http://studio-web:8000
  # Explicit private-cluster HTTP opt-in. Prefer an internal TLS/service-mesh
  # origin and set this to "0" before putting a real admin credential here.
  STUDIO_TRAJECTORY_ALLOW_INSECURE_HTTP: "1"
  STUDIO_TRAJECTORY_SCOPE: ""
  STUDIO_TRAJECTORY_OUTPUT_DIR: /var/lib/studio-trajectory
  STUDIO_TRAJECTORY_BASE_MODEL: microsoft/bitnet-b1.58-2B-4T-bf16
  STUDIO_TRAJECTORY_TRAIN_MODE: sft
  STUDIO_TRAJECTORY_TRAIN_MAX_LENGTH: "4096"
  STUDIO_TRAJECTORY_ADAPTER_BASE_URI: ""
  # JSON argv for an evaluator included in the private trainer image.
  STUDIO_TRAJECTORY_EVALUATOR_COMMAND: ""
  STUDIO_TRAJECTORY_EVAL_SUITE_SHA256: ""
  STUDIO_TRAJECTORY_EVAL_MIN_CANDIDATE_PASS_RATE: "0.9"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: studio-trajectory-trainer
  namespace: studio-system
spec:
  # Safety default: this example cannot spend GPU or stream private data until
  # an operator configures a private copy and explicitly unsuspends it.
  suspend: true
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-trajectory-trainer
        app.kubernetes.io/part-of: studio
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          image: studio-trajectory-trainer:cuda-required
          imagePullPolicy: IfNotPresent
          command:
            - python
            - train_trajectory_policy.py
            - --once
            - --defer-publish
          envFrom:
            - configMapRef:
                name: studio-trajectory-trainer-config
            - secretRef:
                name: studio-trajectory-trainer-secrets
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
            limits:
              cpu: "8"
              memory: 24Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /var/lib/studio-trajectory
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: studio-trajectory-training
