apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: studio-system
resources:
  - namespace.yaml
  - storage.yaml
  - config.yaml
  - runtime.yaml
  - network-policy.yaml

# Replace this tag with an immutable digest before applying to production:
#   kustomize edit set image studio:portable=registry.example/studio@sha256:...
images:
  - name: studio
    newName: studio
    newTag: portable
